services:
  redis:
    image: redis:8.8
    container_name: dev-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:9.7
    container_name: dev-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mall
      MYSQL_USER: mall
      MYSQL_PASSWORD: mall
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7.0
    container_name: dev-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:123456@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: 123456


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: dev-es
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # Jaeger all-in-one：分布式链路追踪后端与 UI（http://localhost:16686）。
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: dev-jaeger
    restart: always
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # SPM（Monitor 面板）：让 Jaeger query 从 Prometheus 读取 spanmetrics 产出的 RED 指标。
      METRICS_STORAGE_TYPE: "prometheus"
      PROMETHEUS_SERVER_URL: "http://prometheus:9090"
      # spanmetrics 产出的指标名为 calls_total / duration_*，开启归一化以匹配 Jaeger 的查询。
      PROMETHEUS_QUERY_NORMALIZE_CALLS: "true"
      PROMETHEUS_QUERY_NORMALIZE_DURATION: "true"
    ports:
      - "16686:16686" # Jaeger UI

  # OpenTelemetry Collector：统一接收各服务的 OTLP 数据（gRPC :4317 / HTTP :4318）。
  # 服务侧将 otel.endpoint 指向 localhost:4317 即可上报 traces/metrics/logs。
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: dev-otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus 抓取端点（metrics）
    depends_on:
      - jaeger

  # Prometheus：兼容 Prometheus 协议的时序数据库，抓取并存储 collector 暴露的服务指标，
  # 提供查询与告警能力（UI/查询: http://localhost:9090）。
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: dev-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI / 查询接口
    depends_on:
      - otel-collector

volumes:
  redis_data:
  mysql_data:
  mongo_data:
  es_data:
  prometheus_data:
