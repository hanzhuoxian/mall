# Prometheus 配置（开发环境）。
# 抓取 OpenTelemetry Collector 通过 prometheus exporter 暴露的服务指标（collector :8889/metrics），
# 将其存入 Prometheus 内置的时序数据库，供查询与告警使用（UI: http://localhost:9090）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OTel Collector 暴露的应用指标（traces/metrics/logs 中的 metrics 管道）。
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Prometheus 自身指标。
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
